
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cart | GaonKart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8faf5;color:#243126}header{background:#245b3d;color:white;padding:17px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:white;text-decoration:none;margin:0 7px}.logo{font-size:24px;font-weight:bold}.wrap{max-width:900px;margin:25px auto;padding:0 5%}.panel{background:white;border:1px solid #e0e7dc;border-radius:14px;padding:20px;margin:18px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e6e9e3;padding:14px 0;flex-wrap:wrap}.qty button{padding:7px 12px;cursor:pointer}.total{font-size:24px;font-weight:bold;color:#245b3d}label{display:block;font-weight:bold;margin-top:12px}input,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #ccd5c9;border-radius:8px;font:inherit}textarea{min-height:85px}.btn{background:#245b3d;color:white;padding:12px 17px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:15px}.remove{background:#f8e7e5;color:#9a2920;border:0;padding:8px;border-radius:6px;cursor:pointer}footer{text-align:center;padding:24px;background:#1c3828;color:white;margin-top:35px}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">🌿 GaonKart</a>
<nav><a href="index.html">Home</a><a href="fruits.html">Fruits</a><a href="about.html">About</a><a href="user-caet.html">Cart</a><a href="user-dashboard.html">My Orders</a></nav>
</header>
<main class="wrap">
<h1>🛒 Your Cart</h1>
<section class="panel">
<div id="cartItems"></div>
<p class="total" id="total">Total: ₹0</p>
<a href="index.html">← Continue Shopping</a>
</section>
<section class="panel">
<h2>Customer Details</h2>
<p>Order details WhatsApp mein bhejne ke liye neeche ki information bharein.</p>
<form id="checkoutForm">
<label for="customerName">Full Name *</label>
<input id="customerName" name="customerName" required maxlength="100" autocomplete="name">
<label for="customerPhone">Mobile Number *</label>
<input id="customerPhone" name="customerPhone" required type="tel" pattern="[0-9+\-\s]{10,16}" autocomplete="tel" placeholder="Aapka mobile number">
<label for="address">Full Address *</label>
<textarea id="address" name="address" required maxlength="400" autocomplete="street-address" placeholder="House number, street, area"></textarea>
<label for="village">Village / City *</label>
<input id="village" name="village" required maxlength="100" autocomplete="address-level2">
<label for="pin">PIN Code *</label>
<input id="pin" name="pin" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 digit PIN code" autocomplete="postal-code">
<button class="btn" type="submit">Order on WhatsApp</button>
</form>
<p id="notice" role="status"></p>
</section>
</main>
<footer>© 2026 GaonKart</footer>
<script>
/* Apna WhatsApp number country code ke saath likhein, sirf digits.
   Example format: 91 + 10 digit mobile number. */
const WHATSAPP_NUMBER = "919315632708";

const PRODUCTS=[
{id:"mango",name:"Fresh Mango",price:120,unit:"1 kg"},
{id:"banana",name:"Fresh Bananas",price:50,unit:"1 dozen"},
{id:"apple",name:"Fresh Apples",price:160,unit:"1 kg"},
{id:"claypot",name:"Handmade Clay Matka",price:250,unit:"1 piece"},
{id:"basket",name:"Bamboo Basket",price:180,unit:"1 piece"},
{id:"jute",name:"Jute Shopping Bag",price:100,unit:"1 piece"},
{id:"diya",name:"Clay Diya Set",price:80,unit:"Set of 6"},
{id:"wooden-spoon",name:"Wooden Spoon",price:70,unit:"1 piece"}
];
function getCart(){try{return JSON.parse(localStorage.getItem("gaonCart")||"[]")}catch(e){return []}}
function saveCart(cart){localStorage.setItem("gaonCart",JSON.stringify(cart))}
function getItems(){return getCart().map(c=>{const p=PRODUCTS.find(x=>x.id===c.id);return p?{...p,qty:Math.max(1,Number(c.qty)||1)}:null}).filter(Boolean)}
function render(){
const cart=getCart(),items=getItems(),root=document.getElementById("cartItems");
if(!items.length){root.innerHTML="<p>Aapka cart abhi khaali hai.</p>";document.getElementById("total").textContent="Total: ₹0";return}
root.innerHTML=items.map(p=>`<div class="item"><div><strong>${p.name}</strong><br>₹${p.price} × ${p.qty} = ₹${p.price*p.qty}</div><div class="qty"><button type="button" onclick="changeQty('${p.id}',-1)">−</button> ${p.qty} <button type="button" onclick="changeQty('${p.id}',1)">+</button> <button type="button" class="remove" onclick="removeItem('${p.id}')">Remove</button></div></div>`).join("");
document.getElementById("total").textContent="Total: ₹"+items.reduce((s,p)=>s+p.price*p.qty,0);
}
function changeQty(id,delta){let cart=getCart(),p=cart.find(x=>x.id===id);if(p)p.qty+=delta;cart=cart.filter(x=>x.qty>0);saveCart(cart);render()}
function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));render()}
document.getElementById("checkoutForm").addEventListener("submit",function(e){
e.preventDefault();
const items=getItems();
if(!items.length){alert("Pehle cart mein product add karein.");return}
if(!/^[0-9]{10,15}$/.test(whatsapp_number)){alert("Code mein WHATSAPP_NUMBER ko apne WhatsApp number se replace karein. Sirf digits likhein, jaise 91 ke baad 10 digit mobile number.");return}
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("address").value.trim();
const village=document.getElementById("village").value.trim();
const pin=document.getElementById("pin").value.trim();
if(!name||!phone||!address||!village||!/^[0-9]{6}$/.test(pin)){alert("Kripya sabhi details sahi bharein.");return}
const total=items.reduce((s,p)=>s+p.price*p.qty,0);
const order={orderId:"GK"+Date.now(),date:new Date().toLocaleString("en-IN"),name,phone,address,village,pin,items:items.map(p=>({id:p.id,name:p.name,price:p.price,qty:p.qty})),total,status:"WhatsApp order prepared"};
let orders=[];try{orders=JSON.parse(localStorage.getItem("gaonOrders")||"[]")}catch(err){}
orders.unshift(order);localStorage.setItem("gaonOrders",JSON.stringify(orders));
const lines=items.map(p=>`- ${p.name} (${p.qty} x Rs ${p.price}) = Rs ${p.qty*p.price}`).join("\n");
const message=`NAMASTE, MUJHE GAONKART PAR ORDER KARNA HAI\nOrder ID: ${order.orderId}\n\nPRODUCTS:\n${lines}\n\nTOTAL: Rs ${total}\n\nCUSTOMER DETAILS:\nName: ${name}\nMobile: ${phone}\nAddress: ${address}\nVillage/City: ${village}\nPIN: ${pin}\n\nKripya availability, delivery aur final amount confirm karein.`;
document.getElementById("notice").textContent="WhatsApp khol rahe hain. Message check karke Send dabayein.";
window.location.href="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message);
});
render();
</script>
</body>
</html>
