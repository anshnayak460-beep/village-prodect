<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cart | GaonKart</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8faf5;
    color: #243126;
}

header {
    background: #245b3d;
    color: white;
    padding: 17px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

header a {
    color: white;
    text-decoration: none;
    margin: 0 7px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.wrap {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 5%;
}

.panel {
    background: white;
    border: 1px solid #e0e7dc;
    border-radius: 14px;
    padding: 20px;
    margin: 18px 0;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #e6e9e3;
    padding: 14px 0;
    flex-wrap: wrap;
}

.qty {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.qty button {
    padding: 7px 12px;
    cursor: pointer;
}

.total {
    font-size: 24px;
    font-weight: bold;
    color: #245b3d;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccd5c9;
    border-radius: 8px;
    font: inherit;
}

textarea {
    min-height: 85px;
    resize: vertical;
}

.btn {
    background: #245b3d;
    color: white;
    padding: 12px 17px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}

.btn:hover {
    background: #19452d;
}

.remove {
    background: #f8e7e5;
    color: #9a2920;
    border: 0;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 25px 5px;
}

.empty a {
    color: #245b3d;
    font-weight: bold;
}

#notice {
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    padding: 24px;
    background: #1c3828;
    color: white;
    margin-top: 35px;
}

@media (max-width: 600px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    header nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    header a {
        margin: 0;
    }

    .item {
        align-items: flex-start;
    }

    .total {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="index.html">🌿 GaonKart</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="fruits.html">Fruits</a>
        <a href="about.html">About</a>
        <a href="user-caet.html">Cart</a>
        <a href="user-dashboard.html">My Orders</a>
    </nav>
</header>

<main class="wrap">

    <h1>🛒 Your Cart</h1>

    <section class="panel">
        <div id="cartItems"></div>

        <p class="total" id="total">Total: ₹0</p>

        <a href="index.html">← Continue Shopping</a>
    </section>

    <section class="panel">
        <h2>Customer Details</h2>

        <p>
            Order WhatsApp par bhejne ke liye neeche
            apni details bharein.
        </p>

        <form id="checkoutForm">

            <label for="customerName">Full Name *</label>
            <input
                id="customerName"
                name="customerName"
                required
                maxlength="100"
                autocomplete="name"
            >

            <label for="customerPhone">Mobile Number *</label>
            <input
                id="customerPhone"
                name="customerPhone"
                type="tel"
                required
                pattern="[0-9+ -]{10,16}"
                autocomplete="tel"
                placeholder="Aapka mobile number"
            >

            <label for="address">Full Address *</label>
            <textarea
                id="address"
                name="address"
                required
                maxlength="400"
                autocomplete="street-address"
                placeholder="House number, street, area"
            ></textarea>

            <label for="village">Village / City *</label>
            <input
                id="village"
                name="village"
                required
                maxlength="100"
                autocomplete="address-level2"
            >

            <label for="pin">PIN Code *</label>
            <input
                id="pin"
                name="pin"
                required
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="6 digit PIN code"
                autocomplete="postal-code"
            >

            <button class="btn" type="submit">
                Order on WhatsApp
            </button>

        </form>

        <p id="notice" role="status" aria-live="polite"></p>
    </section>

</main>

<footer>
    © 2026 GaonKart | Smart Village Shopping
</footer>

<script>
"use strict";

/*
  IMPORTANT:
  WhatsApp number country code ke saath likhein.
  Sirf digits: +, spaces aur hyphens nahi.
  Example format: 91 + 10 digit mobile number.
*/
const WHATSAPP_NUMBER = "919315632708";

/*
  Product IDs aur prices ko apne fruits.html
  aur index.html ke products se match karein.
*/
const PRODUCTS = [
    {
        id: "mango",
        name: "Fresh Mango",
        price: 120,
        unit: "1 kg"
    },
    {
        id: "banana",
        name: "Fresh Bananas",
        price: 50,
        unit: "1 dozen"
    },
    {
        id: "apple",
        name: "Fresh Apples",
        price: 160,
        unit: "1 kg"
    },
    {
        id: "claypot",
        name: "Handmade Clay Matka",
        price: 250,
        unit: "1 piece"
    },
    {
        id: "basket",
        name: "Bamboo Basket",
        price: 180,
        unit: "1 piece"
    },
    {
        id: "jute",
        name: "Jute Shopping Bag",
        price: 100,
        unit: "1 piece"
    },
    {
        id: "diya",
        name: "Clay Diya Set",
        price: 80,
        unit: "Set of 6"
    },
    {
        id: "wooden-spoon",
        name: "Wooden Spoon",
        price: 70,
        unit: "1 piece"
    }
];

/* Safely read JSON from localStorage */
function readStorage(key, fallback = []) {
    try {
        const value = JSON.parse(
            localStorage.getItem(key) || "null"
        );

        return value === null ? fallback : value;
    } catch (error) {
        return fallback;
    }
}

/* Get cart */
function getCart() {
    const cart = readStorage("gaonCart", []);

    if (!Array.isArray(cart)) {
        return [];
    }

    return cart
        .filter(item =>
            item &&
            typeof item.id === "string" &&
            Number.isSafeInteger(Number(item.qty)) &&
            Number(item.qty) > 0
        )
        .map(item => ({
            id: item.id,
            qty: Math.min(99, Number(item.qty))
        }));
}

/* Save cart */
function saveCart(cart) {
    localStorage.setItem(
        "gaonCart",
        JSON.stringify(cart)
    );
}

/* Match cart products with trusted product data */
function getItems() {
    return getCart()
        .map(cartItem => {
            const product = PRODUCTS.find(
                p => p.id === cartItem.id
            );

            if (!product) {
                return null;
            }

            return {
                ...product,
                qty: cartItem.qty
            };
        })
        .filter(Boolean);
}

/* Render cart */
function render() {
    const items = getItems();
    const root = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");

    if (items.length === 0) {
        root.innerHTML = `
            <div class="empty">
                <h3>🛒 Aapka cart khaali hai</h3>
                <p>Shopping shuru karne ke liye products add karein.</p>
                <a href="index.html">Shop Now</a>
            </div>
        `;

        totalElement.textContent = "Total: ₹0";
        return;
    }

    root.replaceChildren();

    items.forEach(product => {
        const item = document.createElement("div");
        item.className = "item";

        const info = document.createElement("div");

        const name = document.createElement("strong");
        name.textContent = product.name;

        const details = document.createElement("div");
        details.textContent =
            `₹${product.price} × ${product.qty} = ₹${product.price * product.qty}`;

        info.append(name, document.createElement("br"), details);

        const controls = document.createElement("div");
        controls.className = "qty";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", `Decrease ${product.name}`);
        minus.disabled = product.qty <= 1;
        minus.addEventListener("click", () => {
            changeQty(product.id, -1);
        });

        const quantity = document.createElement("span");
        quantity.textContent = product.qty;

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", `Increase ${product.name}`);
        plus.disabled = product.qty >= 99;
        plus.addEventListener("click", () => {
            changeQty(product.id, 1);
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
            removeItem(product.id);
        });

        controls.append(minus, quantity, plus, remove);
        item.append(info, controls);
        root.appendChild(item);
    });

    const total = items.reduce(
        (sum, product) => sum + product.price * product.qty,
        0
    );

    totalElement.textContent = "Total: ₹" + total;
}

/* Update quantity */
function changeQty(id, delta) {
    const cart = getCart();
    const product = cart.find(item => item.id === id);

    if (!product) {
        return;
    }

    product.qty = Math.min(99, product.qty + delta);

    if (product.qty <= 0) {
        removeItem(id);
        return;
    }

    saveCart(cart);
    render();
}

/* Remove product */
function removeItem(id) {
    const cart = getCart().filter(
        item => item.id !== id
    );

    saveCart(cart);
    render();
}

/* Checkout */
document
    .getElementById("checkoutForm")
    .addEventListener("submit", function (event) {

        event.preventDefault();

        const notice = document.getElementById("notice");
        notice.textContent = "";

        const items = getItems();

        if (items.length === 0) {
            alert("Pehle cart mein product add karein.");
            return;
        }

        /*
          FIXED:
          Correct variable name is WHATSAPP_NUMBER,
          not whatsapp_number.
        */
        if (!/^[0-9]{10,15}$/.test(WHATSAPP_NUMBER)) {
            alert(
                "Code mein WHATSAPP_NUMBER ko sahi country code aur mobile number se replace karein. Sirf digits likhein."
            );
            return;
        }

        const name = document
            .getElementById("customerName")
            .value.trim();

        const phone = document
            .getElementById("customerPhone")
            .value.trim();

        const address = document
            .getElementById("address")
            .value.trim();

        const village = document
            .getElementById("village")
            .value.trim();

        const pin = document
            .getElementById("pin")
            .value.trim();

        if (
            !name ||
            !phone ||
            !address ||
            !village ||
            !/^[0-9]{6}$/.test(pin)
        ) {
            alert("Kripya sabhi details sahi bharein.");
            return;
        }

        const total = items.reduce(
            (sum, product) =>
                sum + product.price * product.qty,
            0
        );

        const order = {
            orderId: "GK" + Date.now(),
            date: new Date().toLocaleString("en-IN"),
            name,
            phone,
            address,
            village,
            pin,
            items: items.map(product => ({
                id: product.id,
                name: product.name,
                price: product.price,
                qty: product.qty
            })),
            total,
            status: "WhatsApp order prepared"
        };

        /*
          Save order locally for the My Orders page.
          This is browser storage, not an online database.
        */
        const orders = readStorage("gaonOrders", []);

        if (Array.isArray(orders)) {
            orders.unshift(order);

            try {
                localStorage.setItem(
                    "gaonOrders",
                    JSON.stringify(orders)
                );
            } catch (error) {
                console.error("Could not save order:", error);
            }
        }

        const lines = items.map(product =>
            `- ${product.name} (${product.qty} x Rs ${product.price}) = Rs ${product.qty * product.price}`
        ).join("\n");

        const message =
`NAMASTE, MUJHE GAONKART PAR ORDER KARNA HAI

Order ID: ${order.orderId}

PRODUCTS:
${lines}

TOTAL: Rs ${total}

CUSTOMER DETAILS:
Name: ${name}
Mobile: ${phone}
Address: ${address}
Village/City: ${village}
PIN: ${pin}

Kripya availability, delivery aur final amount confirm karein.`;

        const whatsappURL =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(message);

        notice.textContent =
            "WhatsApp khul raha hai. Message check karke Send dabayein.";

        window.location.href = whatsappURL;
    });

/* Initial render */
render();
</script>

</body>
</html>
