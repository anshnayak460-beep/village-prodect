
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details | GaonKart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8faf5;color:#243126}header{background:#245b3d;color:white;padding:17px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:white;text-decoration:none;margin:0 7px}.logo{font-size:24px;font-weight:bold}.wrap{max-width:950px;margin:35px auto;padding:0 5%}.product{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px;background:white;padding:22px;border-radius:15px;border:1px solid #e0e7dc}.product img{width:100%;max-height:390px;object-fit:cover;border-radius:12px}.price{font-size:27px;font-weight:bold;color:#245b3d}.btn{background:#245b3d;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}.muted{color:#667366;line-height:1.6}footer{text-align:center;padding:24px;background:#1c3828;color:white;margin-top:35px}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">🌿 GaonKart</a>
<nav><a href="index.html">Home</a><a href="fruits.html">Fruits</a><a href="about.html">About</a><a href="user-caet.html">🛒 Cart</a><a href="user-dashboard.html">My Orders</a></nav>
</header>
<main class="wrap">
<a href="index.html">← Back to products</a>
<div id="product"></div>
</main>
<footer>© 2026 GaonKart</footer>
<script>
const PRODUCTS=[
{id:"mango",name:"Fresh Mango",price:120,unit:"1 kg",category:"fruits",image:"https://images.unsplash.com/photo-1553279768-865429fa0078?auto=format&fit=crop&w=700&q=80",desc:"Seasonal fresh mangoes sourced from local growers."},
{id:"banana",name:"Fresh Bananas",price:50,unit:"1 dozen",category:"fruits",image:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=700&q=80",desc:"Fresh bananas for everyday use."},
{id:"apple",name:"Fresh Apples",price:160,unit:"1 kg",category:"fruits",image:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=700&q=80",desc:"Crisp apples, carefully packed."},
{id:"claypot",name:"Handmade Clay Matka",price:250,unit:"1 piece",category:"handmade",image:"https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&w=700&q=80",desc:"Traditional handmade clay pot."},
{id:"basket",name:"Bamboo Basket",price:180,unit:"1 piece",category:"handmade",image:"https://images.unsplash.com/photo-1590736969955-71cc94901144?auto=format&fit=crop&w=700&q=80",desc:"Useful woven basket for home storage."},
{id:"jute",name:"Jute Shopping Bag",price:100,unit:"1 piece",category:"handmade",image:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=700&q=80",desc:"Reusable bag for everyday shopping."},
{id:"diya",name:"Clay Diya Set",price:80,unit:"Set of 6",category:"home",image:"https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=700&q=80",desc:"Traditional clay diyas made by local artisans."},
{id:"wooden-spoon",name:"Wooden Spoon",price:70,unit:"1 piece",category:"home",image:"https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=700&q=80",desc:"Simple wooden kitchen utensil."}
];
function addToCart(id){let cart=[];try{cart=JSON.parse(localStorage.getItem("gaonCart")||"[]")}catch(e){}let item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});localStorage.setItem("gaonCart",JSON.stringify(cart));alert("Product cart mein add ho gaya!");}
const id=new URLSearchParams(location.search).get("id");
const p=PRODUCTS.find(x=>x.id===id);
const root=document.getElementById("product");
if(!p){root.innerHTML="<h2>Product nahi mila</h2><p>Homepage se product select karein.</p><a href='index.html'>Homepage par jayein</a>";}
else{document.title=p.name+" | GaonKart";root.innerHTML=`<section class="product"><img src="${p.image}" alt="${p.name}"><div><p class="muted">${p.category.toUpperCase()}</p><h1>${p.name}</h1><p class="price">₹${p.price}</p><p>${p.unit}</p><p class="muted">${p.desc}</p><p>Availability aur delivery details seller se order ke waqt confirm karein.</p><button class="btn" onclick="addToCart('${p.id}')">Add to Cart</button><a class="btn" href="user-caet.html">Go to Cart</a></div></section>`;}
</script>
</body>
</html>
