<!-- PRODUCT SECTION -->
<section class="shop">
  <h2>🌾 Popular Village Products</h2>
  <p>गाँव के कारीगरों से सीधे खरीदें</p>

  <div class="product-grid" id="productGrid"></div>
</section>

<style>
.shop {
  padding: 20px;
  background: #f1f3f6;
  font-family: Arial, sans-serif;
}
.shop h2 { margin-bottom: 8px; }
.shop > p { color: #777; margin-bottom: 18px; }

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.product-card {
  background: white;
  border: 1px solid #eee;
  padding: 8px;
  overflow: hidden;
}

.product-card img {
  width: 100%;
  height: 220px;
  object-fit: contain;
  background: #f5f5f5;
}

.product-card h3 {
  font-size: 14px;
  font-weight: 500;
  margin: 10px 0;
}

.product-rating {
  background: #388e3c;
  color: white;
  font-size: 11px;
  padding: 4px 6px;
  display: inline-block;
}

.product-price {
  font-weight: bold;
  margin: 10px 0;
}

.old-price {
  color: #888;
  text-decoration: line-through;
  font-size: 12px;
  font-weight: normal;
}

.off { color: #388e3c; font-size: 12px; }

.product-card button {
  width: 100%;
  padding: 10px 4px;
  margin-top: 6px;
  border: 0;
  cursor: pointer;
  font-weight: bold;
}

.cart-btn { background: white; color: #2874f0; border: 1px solid #2874f0 !important; }
.buy-btn { background: #ffca28; color: #222; }

#cartMessage {
  margin-top: 15px;
  padding: 12px;
  background: white;
}

@media(max-width:800px) {
  .product-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .product-card img { height: 180px; }
}
@media(max-width:520px) {
  .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .product-card img { height: 155px; }
  .product-card h3 { font-size: 12px; }
}
</style>

<script>
const villageProducts = [
  {
    id: 1,
    name: "Traditional Clay Matka",
    price: 399,
    old: 599,
    rating: 4.5,
    reviews: "128",
    image: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 2,
    name: "Handmade Wooden Spoon",
    price: 149,
    old: 249,
    rating: 4.4,
    reviews: "86",
    image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 3,
    name: "Terracotta Flower Pot",
    price: 199,
    old: 299,
    rating: 4.6,
    reviews: "95",
    image: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 4,
    name: "Handwoven Bamboo Basket",
    price: 279,
    old: 399,
    rating: 4.3,
    reviews: "67",
    image: "https://images.unsplash.com/photo-1590736969955-71cc94901144?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 5,
    name: "Traditional Clay Diya Set",
    price: 99,
    old: 149,
    rating: 4.7,
    reviews: "230",
    image: "https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 6,
    name: "Wooden Kitchen Utensils",
    price: 299,
    old: 449,
    rating: 4.5,
    reviews: "112",
    image: "https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 7,
    name: "Natural Handmade Decor",
    price: 349,
    old: 499,
    rating: 4.2,
    reviews: "53",
    image: "https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 8,
    name: "Reusable Jute Shopping Bag",
    price: 179,
    old: 249,
    rating: 4.4,
    reviews: "144",
    image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=500&q=80"
  }
];

let villageCart = [];

function renderVillageProducts() {
  document.getElementById("productGrid").innerHTML =
    villageProducts.map(p => {
      const discount = Math.round((p.old - p.price) / p.old * 100);

      return `
        <div class="product-card">
          <img src="${p.image}"
               alt="${p.name}"
               loading="lazy"
               onerror="this.style.objectFit='contain';this.alt='Product image unavailable'">

          <h3>${p.name}</h3>

          <span class="product-rating">★ ${p.rating}</span>
          <small> (${p.reviews})</small>

          <p class="product-price">
            ₹${p.price}
            <span class="old-price">₹${p.old}</span>
            <span class="off">${discount}% off</span>
          </p>

          <small style="color:#388e3c">
            ✓ Handmade · Local Artisan
          </small>

          <button class="cart-btn"
                  onclick="addVillageCart(${p.id})">
            Add to Cart
          </button>

          <button class="buy-btn"
                  onclick="buyVillageProduct(${p.id})">
            Buy Now
          </button>
        </div>
      `;
    }).join("");
}

function addVillageCart(id) {
  const product = villageProducts.find(p => p.id === id);
  villageCart.push(product);
  document.getElementById("cartMessage").innerHTML =
    `✅ ${product.name} cart में add हो गया। कुल आइटम: ${villageCart.length}`;
}

function buyVillageProduct(id) {
  addVillageCart(id);
  const product = villageProducts.find(p => p.id === id);
  alert(
    "Order Preview\\n\\n" + product.name +
    "\\nPrice: ₹" + product.price +
    "\\n\\nयह demo है। वास्तविक ऑर्डर के लिए checkout/backend जोड़ें।"
  );
}

renderVillageProducts();
</script>

<div id="cartMessage">🛒 आपका Cart खाली है।</div>
