
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Fruits | GaonKart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8faf5;color:#243126}header{background:#245b3d;color:white;padding:17px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:white;text-decoration:none;margin:0 7px}.logo{font-size:24px;font-weight:bold}.hero{padding:35px 6%;background:#e4f1d9}.wrap{padding:25px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #e0e7dc;border-radius:14px;overflow:hidden}.card img{width:100%;height:180px;object-fit:cover}.info{padding:15px}.price{font-size:20px;font-weight:bold;color:#245b3d}.btn{display:inline-block;background:#245b3d;color:white;padding:11px 15px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;margin:4px 4px 0 0}footer{text-align:center;padding:24px;background:#1c3828;color:white;margin-top:35px}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">🌿 GaonKart</a>
<nav><a href="index.html">Home</a><a href="fruits.html">Fruits</a><a href="about.html">About</a><a href="user-caet.html">🛒 Cart</a><a href="user-dashboard.html">My Orders</a></nav>
</header>
<section class="hero"><h1>🍎 Fresh Fruits</h1><p>Seasonal fruits chunein aur apne cart mein add karein.</p></section>
<main class="wrap">
<div id="fruitGrid" class="grid"></div>
</main>
<footer>© 2026 GaonKart</footer>
<script>
const FRUITS=[
{id:"mango",name:"Fresh Mango",price:120,unit:"1 kg",image:"https://images.unsplash.com/photo-1553279768-865429fa0078?auto=format&fit=crop&w=600&q=80",desc:"Seasonal fresh mangoes sourced from local growers."},
{id:"banana",name:"Fresh Bananas",price:50,unit:"1 dozen",image:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=600&q=80",desc:"Fresh bananas for everyday use."},
{id:"apple",name:"Fresh Apples",price:160,unit:"1 kg",image:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=600&q=80",desc:"Crisp apples, carefully packed."}
];
function addToCart(id){let cart=[];try{cart=JSON.parse(localStorage.getItem("gaonCart")||"[]")}catch(e){}const item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});localStorage.setItem("gaonCart",JSON.stringify(cart));alert("Fruit cart mein add ho gaya!");}
document.getElementById("fruitGrid").innerHTML=FRUITS.map(p=>`<article class="card"><img src="${p.image}" alt="${p.name}" loading="lazy"><div class="info"><h3>${p.name}</h3><p>${p.unit}</p><p>${p.desc}</p><p class="price">₹${p.price}</p><a class="btn" href="descripation-page.html?id=${p.id}">Details</a><button class="btn" onclick="addToCart('${p.id}')">Add to Cart</button></div></article>`).join("");
</script>
</body>
</html>
